[workspace]
name = "smoke"
version = "0.1.0"
description = "PS 2, ex 2: does smoking really increase survival? A look at confounders."
authors = ["Vibhor Vanvani <vibhorvanvani@gmail.com>"]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tasks]
lab = "jupyter lab smoking_is_bad.ipynb"
hooks = "pre-commit install"
run-notebook = "jupyter nbconvert --to notebook --execute --inplace smoking_is_bad.ipynb"

[dependencies]
python = "3.12.*"
pandas = ">=3.1.1,<4"
numpy = ">=2.5.4,<3"
matplotlib = ">=3.11.2,<4"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.15.0,<0.16"
jupyterlab = ">=4.6.5,<5"
ipykernel = ">=7.4.0,<8"
pre-commit = ">=4.7.0,<5"
nbstripout = ">=0.9.1,<0.10"
